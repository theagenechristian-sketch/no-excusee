<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>No Excuse — Profil</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--bg:#252829;--bg2:#1e2021;--accent:#c0765a;--text:#f0ede8;--text2:rgba(240,237,232,0.5);--text3:rgba(240,237,232,0.25);--border:rgba(240,237,232,0.08);--green:#7ec89a;--sidebar:64px;}
    *{cursor:none!important;}
    html,body{height:100%;font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;}
    #crosshair{position:fixed;width:36px;height:36px;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);}
    #crosshair.clicked{transform:translate(-50%,-50%) scale(0.7);}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);background:var(--bg2);border-right:0.5px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:24px 0;gap:28px;z-index:50;}
    .sidebar-logo{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.16em;color:var(--accent);writing-mode:vertical-rl;text-transform:uppercase;}
    .sidebar-divider{width:20px;height:0.5px;background:var(--border);}
    .nav-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;opacity:0.3;text-decoration:none;transition:opacity .2s,background .2s;}
    .nav-icon:hover{opacity:0.7;background:rgba(240,237,232,0.05);}
    .nav-icon.active{opacity:1;background:rgba(192,118,90,0.12);}
    .nav-icon svg{width:16px;height:16px;stroke:var(--text);fill:none;stroke-width:1.5;stroke-linecap:round;}
    .sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:16px;}
    .avatar-sm{width:32px;height:32px;border-radius:50%;background:rgba(192,118,90,0.2);border:0.5px solid rgba(192,118,90,0.4);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--accent);}
    .main{margin-left:var(--sidebar);padding:40px 44px;min-height:100vh;max-width:900px;}
    .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px;opacity:0;transform:translateY(12px);animation:fadeUp 0.6s ease forwards 0.1s;}
    .page-title{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;}
    .profile-hero{display:flex;align-items:center;gap:28px;background:var(--bg2);border-radius:12px;border:0.5px solid var(--border);padding:32px;margin-bottom:20px;opacity:0;transform:translateY(16px);animation:fadeUp 0.6s ease forwards 0.2s;}
    .avatar-lg{width:80px;height:80px;border-radius:50%;background:rgba(192,118,90,0.15);border:0.5px solid rgba(192,118,90,0.3);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:700;color:var(--accent);flex-shrink:0;}
    .profile-info{flex:1;}
    .profile-name{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;}
    .profile-sub{font-size:13px;color:var(--text3);letter-spacing:0.04em;}
    .profile-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;padding:5px 12px;border-radius:50px;background:rgba(192,118,90,0.12);color:var(--accent);border:0.5px solid rgba(192,118,90,0.2);margin-top:10px;}
    .edit-btn{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;padding:9px 20px;border:0.5px solid var(--border);border-radius:50px;background:transparent;color:var(--text3);cursor:pointer;transition:all .2s;}
    .edit-btn:hover{border-color:rgba(240,237,232,0.2);color:var(--text2);}
    .stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:20px;opacity:0;animation:fadeUp 0.6s ease forwards 0.3s;}
    .stat-card{background:var(--bg2);border-radius:10px;padding:20px;border:0.5px solid var(--border);}
    .stat-val{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:700;color:var(--text);letter-spacing:-0.02em;line-height:1;}
    .stat-lbl{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3);margin-top:6px;}
    .section-title{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--text3);margin-bottom:14px;}
    .history-section{opacity:0;animation:fadeUp 0.6s ease forwards 0.4s;}
    .history-card{background:var(--bg2);border-radius:10px;border:0.5px solid var(--border);overflow:hidden;}
    .history-row{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:0.5px solid var(--border);transition:background .15s;}
    .history-row:last-child{border-bottom:none;}
    .history-row:hover{background:rgba(240,237,232,0.02);}
    .hr-date{font-size:11px;color:var(--text3);min-width:64px;}
    .hr-type{font-size:13px;color:var(--text2);flex:1;}
    .hr-arrows{font-size:12px;color:var(--text3);min-width:72px;text-align:right;}
    .hr-score{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:var(--text);min-width:48px;text-align:right;}
    .logout-btn{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;padding:9px 20px;border:0.5px solid rgba(224,122,95,0.3);border-radius:50px;background:transparent;color:#e07a5f;cursor:pointer;transition:all .2s;margin-top:24px;display:inline-block;}
    .logout-btn:hover{background:rgba(224,122,95,0.08);}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
    @media(max-width:768px){.main{padding:24px 16px;}.stats-grid{grid-template-columns:1fr 1fr;}.profile-hero{flex-direction:column;text-align:center;}.hr-arrows{display:none;}}
  </style>
</head>
<body>
  <div id="crosshair"><svg viewBox="0 0 36 36" fill="none"><circle cx="18" cy="18" r="14" stroke="#c0765a" stroke-width="0.8" opacity="0.7"/><circle cx="18" cy="18" r="2.5" fill="#c0765a" opacity="0.9"/><line x1="18" y1="2" x2="18" y2="12" stroke="#c0765a" stroke-width="0.8" opacity="0.7"/><line x1="18" y1="24" x2="18" y2="34" stroke="#c0765a" stroke-width="0.8" opacity="0.7"/><line x1="2" y1="18" x2="12" y2="18" stroke="#c0765a" stroke-width="0.8" opacity="0.7"/><line x1="24" y1="18" x2="34" y2="18" stroke="#c0765a" stroke-width="0.8" opacity="0.7"/></svg></div>
  <aside class="sidebar">
    <div class="sidebar-logo">NE</div><div class="sidebar-divider"></div>
    <a class="nav-icon" href="dashboard.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></a>
    <a class="nav-icon" href="session.html"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></a>
    <a class="nav-icon" href="journal.html"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></a>
    <div class="sidebar-bottom">
      <a class="nav-icon active" href="profil.html"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
      <div class="avatar-sm">C</div>
    </div>
  </aside>
  <main class="main">
    <div class="top-bar">
      <div class="page-title">Profil</div>
    </div>
    <div class="profile-hero">
      <div class="avatar-lg">C</div>
      <div class="profile-info">
        <div class="profile-name" id="p-name">Christ</div>
        <div class="profile-sub" id="p-email">archer@noexcuse.ca</div>
        <div class="profile-badge">Archer actif 🔥</div>
      </div>
      <button class="edit-btn" onclick="toggleEdit()">Modifier</button>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-val" id="p-arrows">—</div><div class="stat-lbl">Flèches totales</div></div>
      <div class="stat-card"><div class="stat-val" id="p-sessions">—</div><div class="stat-lbl">Sessions</div></div>
      <div class="stat-card"><div class="stat-val" id="p-best">—</div><div class="stat-lbl">Meilleur score</div></div>
      <div class="stat-card"><div class="stat-val" id="p-avg">—</div><div class="stat-lbl">Moyenne flèches</div></div>
    </div>
    <div class="history-section">
      <div class="section-title">Historique complet</div>
      <div class="history-card" id="history-list"></div>
      <button class="logout-btn" onclick="if(confirm('Déconnexion ?')) window.location.href='login.html'">Déconnexion</button>
    </div>
  </main>
  <script>
    const ch=document.getElementById('crosshair');let mx=innerWidth/2,my=innerHeight/2,cx=mx,cy=my;
    document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
    (function loop(){cx+=(mx-cx)*.18;cy+=(my-cy)*.18;ch.style.left=cx+'px';ch.style.top=cy+'px';requestAnimationFrame(loop);})();
    document.addEventListener('mousedown',()=>ch.classList.add('clicked'));
    document.addEventListener('mouseup',()=>ch.classList.remove('clicked'));
    const DEFAULT=[{date:'2025-03-27',type:'Distance 18m',arrows:72,score:287},{date:'2025-03-25',type:'Technique pure',arrows:48,score:null},{date:'2025-03-22',type:'Compétition simulée',arrows:144,score:312},{date:'2025-03-18',type:'Entraînement libre',arrows:60,score:241},{date:'2025-03-14',type:'Distance 25m',arrows:96,score:198}];
    const getSessions=()=>JSON.parse(localStorage.getItem('ne-sessions')||'null')||DEFAULT;
    function loadStats(){
      const sessions=getSessions();
      const totalArrows=sessions.reduce((s,e)=>s+e.arrows,0);
      const scores=sessions.filter(s=>s.score).map(s=>s.score);
      const best=scores.length?Math.max(...scores):0;
      const avg=sessions.length?Math.round(totalArrows/sessions.length):0;
      document.getElementById('p-arrows').textContent=totalArrows.toLocaleString();
      document.getElementById('p-sessions').textContent=sessions.length;
      document.getElementById('p-best').textContent=best||'—';
      document.getElementById('p-avg').textContent=avg;
      const list=document.getElementById('history-list');
      list.innerHTML=sessions.map(s=>{
        const d=new Date(s.date);
        const dateStr=d.toLocaleDateString('fr-CA',{day:'2-digit',month:'short',year:'numeric'});
        return`<div class="history-row"><div class="hr-date">${dateStr}</div><div class="hr-type">${s.type}</div><div class="hr-arrows">${s.arrows} flèches</div><div class="hr-score">${s.score||'—'}</div></div>`;
      }).join('');
    }
    loadStats();
    function toggleEdit(){
      const name=document.getElementById('p-name');
      const email=document.getElementById('p-email');
      const newName=prompt('Ton nom :',name.textContent);
      if(newName)name.textContent=newName;
    }
  </script>
</body>
</html>
