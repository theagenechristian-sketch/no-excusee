<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>No Excuse — Connexion</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    :root {
      --bg: #252829;
      --bg2: #1e2021;
      --surface: rgba(240,237,232,0.05);
      --border: rgba(240,237,232,0.1);
      --text: #f0ede8;
      --text2: rgba(240,237,232,0.5);
      --text3: rgba(240,237,232,0.25);
      --accent: rgb(225, 158, 134);
      --accent2: rgba(192,118,90,0.15);
    }
 
    html, body {
      height: 100%;
      font-family: 'Barlow', sans-serif;
      background: var(--bg);
      color: var(--text);
    }
 
    .page {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
    }
 
    /* ── GAUCHE ── */
    .left {
      position: relative;
      overflow: hidden;
    }
 
    .left-img {
      position: absolute;
      inset: 0;
      background-image: url('https://images.unsplash.com/photo-1511649475669-e288648b2339?w=900&q=80');
      background-size: cover;
      background-position: center 30%;
      transform: scale(1.05);
      animation: zoomOut 8s ease forwards;
    }
 
    @keyframes zoomOut {
      from { transform: scale(1.08); }
      to   { transform: scale(1.0); }
    }
 
    .left-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(20,22,23,0.88) 0%, rgba(20,22,23,0.35) 100%);
    }
 
    .left-content {
      position: relative;
      z-index: 2;
      padding: 48px 52px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
 
    .logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text);
    }
 
    .logo-dot { color: var(--accent); }
 
    .left-phrase {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 58px;
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      color: var(--text);
    }
 
    .left-phrase em {
      font-style: normal;
      color: rgba(240,237,232,0.2);
    }
 
    .left-foot {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text3);
    }
 
    /* ── DROITE ── */
    .right {
      background: var(--bg2);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 52px;
      animation: fadeUp 0.6s ease both;
      animation-delay: 0.2s;
    }
 
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
 
    .form-wrap { width: 100%; max-width: 360px; }
 
    /* tabs */
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 40px;
      border-bottom: 0.5px solid var(--border);
    }
 
    .tab {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding-bottom: 16px;
      margin-right: 32px;
      color: var(--text3);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color .2s, border-color .2s;
    }
 
    .tab.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }
 
    /* champs */
    .field { margin-bottom: 20px; }
 
    .field label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 8px;
    }
 
    .field input {
      width: 100%;
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 6px;
      padding: 13px 16px;
      font-family: 'Barlow', sans-serif;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color .2s, background .2s;
    }
 
    .field input::placeholder { color: var(--text3); }
 
    .field input:focus {
      border-color: var(--accent);
      background: rgba(192,118,90,0.06);
    }
 
    .forgot {
      display: block;
      text-align: right;
      font-size: 11px;
      color: var(--text3);
      margin-top: -12px;
      margin-bottom: 24px;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: color .2s;
    }
 
    .forgot:hover { color: var(--text2); }
 
    /* bouton principal */
    .btn-main {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      border: none;
      border-radius: 6px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #f0ede8;
      cursor: pointer;
      transition: opacity .2s, transform .15s;
    }
 
    .btn-main:hover { opacity: 0.88; }
    .btn-main:active { transform: scale(0.98); }
 
    /* séparateur */
    .or-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
    }
 
    .or-line { flex: 1; height: 0.5px; background: var(--border); }
 
    .or-txt {
      font-size: 11px;
      color: var(--text3);
      letter-spacing: 0.1em;
    }
 
    /* bouton Google */
    .btn-google {
      width: 100%;
      padding: 13px;
      background: transparent;
      border: 0.5px solid var(--border);
      border-radius: 6px;
      font-family: 'Barlow', sans-serif;
      font-size: 13px;
      color: var(--text2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background .2s, border-color .2s;
    }
 
    .btn-google:hover {
      background: var(--surface);
      border-color: rgba(240,237,232,0.2);
    }
 
    .g-icon { width: 16px; height: 16px; flex-shrink: 0; }
 
    /* message erreur */
    .error-msg {
      font-size: 12px;
      color: #ff000454;
      margin-top: 10px;
      min-height: 16px;
      letter-spacing: 0.03em;
    }
 
    /* responsive */
    @media (max-width: 720px) {
      .page { grid-template-columns: 1fr; }
      .left { display: none; }
      .right { min-height: 100vh; }
    }
  </style>
</head>
<body>
 
<div class="page">
 
  <!-- GAUCHE -->
  <div class="left">
    <div class="left-img"></div>
    <div class="left-overlay"></div>
    <div class="left-content">
      <div class="logo">No<span class="logo-dot">.</span>Excuse</div>
      <div>
        <div class="left-phrase">Pas de<br>relâche.<br><em>Pas d'alibi.</em></div>
      </div>
      <div class="left-foot">Tir à l'arc numérique — 2026</div>
    </div>
  </div>
 
  <!-- DROITE -->
  <div class="right">
    <div class="form-wrap">
 
      <div class="tabs">
        <div class="tab active" id="tab-login" onclick="switchTab('login')">Connexion</div>
        <div class="tab" id="tab-signup" onclick="switchTab('signup')">Créer un compte</div>
      </div>
 
      <!-- FORMULAIRE CONNEXION -->
      <div id="form-login">
        <div class="field">
          <label>Adresse courriel</label>
          <input type="email" id="login-email" placeholder="ton@email.com"/>
        </div>
        <div class="field">
          <label>Mot de passe</label>
          <input type="password" id="login-password" placeholder="••••••••"/>
        </div>
        <span class="forgot">Mot de passe oublié ?</span>
        <button class="btn-main" onclick="handleLogin()">Se connecter</button>
        <div class="error-msg" id="login-error"></div>
        <div class="or-row">
          <div class="or-line"></div>
          <div class="or-txt">ou</div>
          <div class="or-line"></div>
        </div>
        <button class="btn-google">
          <svg class="g-icon" viewBox="0 0 24 24">
            <path fill="#EA4335" d="M5.27 9.76A7.08 7.08 0 0 1 19.07 12c0 .68-.06 1.34-.17 1.97H12v-3.73h7.43A7.08 7.08 0 0 0 5.27 9.76z"/>
            <path fill="#34A853" d="M12 19.08a7.06 7.06 0 0 1-6.73-4.93l-3.47 2.69A11.99 11.99 0 0 0 12 24c3.24 0 5.95-1.18 7.94-3.1l-3.28-2.55A7.06 7.06 0 0 1 12 19.08z"/>
            <path fill="#FBBC05" d="M5.27 14.15A7.12 7.12 0 0 1 4.92 12c0-.74.13-1.46.35-2.14L1.8 7.17A11.97 11.97 0 0 0 0 12c0 1.93.46 3.75 1.27 5.36l3.47-2.69-.47-.52z"/>
            <path fill="#4285F4" d="M12 4.92c1.77 0 3.37.65 4.62 1.7l3.45-3.45A11.95 11.95 0 0 0 12 0 11.99 11.99 0 0 0 1.8 7.17l3.47 2.69A7.08 7.08 0 0 1 12 4.92z"/>
          </svg>
          Continuer avec Google
        </button>
      </div>
 
      <!-- FORMULAIRE INSCRIPTION -->
      <div id="form-signup" style="display:none;">
        <div class="field">
          <label>Nom d'utilisateur</label>
          <input type="text" id="signup-username" placeholder="ton_pseudo"/>
        </div>
        <div class="field">
          <label>Adresse courriel</label>
          <input type="email" id="signup-email" placeholder="ton@email.com"/>
        </div>
        <div class="field">
          <label>Mot de passe</label>
          <input type="password" id="signup-password" placeholder="Min. 11 caractères"/>
        </div>
        <button class="btn-main" onclick="handleSignup()">Créer mon compte</button>
        <div class="error-msg" id="signup-error"></div>
        <div class="or-row">
          <div class="or-line"></div>
          <div class="or-txt">ou</div>
          <div class="or-line"></div>
        </div>
        <button class="btn-google">
          <svg class="g-icon" viewBox="0 0 24 24">
            <path fill="#EA4335" d="M5.27 9.76A7.08 7.08 0 0 1 19.07 12c0 .68-.06 1.34-.17 1.97H12v-3.73h7.43A7.08 7.08 0 0 0 5.27 9.76z"/>
            <path fill="#34A853" d="M12 19.08a7.06 7.06 0 0 1-6.73-4.93l-3.47 2.69A11.99 11.99 0 0 0 12 24c3.24 0 5.95-1.18 7.94-3.1l-3.28-2.55A7.06 7.06 0 0 1 12 19.08z"/>
            <path fill="#FBBC05" d="M5.27 14.15A7.12 7.12 0 0 1 4.92 12c0-.74.13-1.46.35-2.14L1.8 7.17A11.97 11.97 0 0 0 0 12c0 1.93.46 3.75 1.27 5.36l3.47-2.69-.47-.52z"/>
            <path fill="#4285F4" d="M12 4.92c1.77 0 3.37.65 4.62 1.7l3.45-3.45A11.95 11.95 0 0 0 12 0 11.99 11.99 0 0 0 1.8 7.17l3.47 2.69A7.08 7.08 0 0 1 12 4.92z"/>
          </svg>
          Continuer avec Google
        </button>
      </div>
 
    </div>
  </div>
</div>
 
<script>
  function switchTab(t) {
    document.getElementById('tab-login').classList.toggle('active', t === 'login');
    document.getElementById('tab-signup').classList.toggle('active', t === 'signup');
    document.getElementById('form-login').style.display = t === 'login' ? 'block' : 'none';
    document.getElementById('form-signup').style.display = t === 'signup' ? 'block' : 'none';
  }
 
  function handleLogin() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const err = document.getElementById('login-error');
    if (!email || !password) {
      err.textContent = 'Remplis tous les champs.';
      return;
    }
    if (!email.includes('@')) {
      err.textContent = 'Adresse courriel invalide.';
      return;
    }
    err.textContent = '';
    // TODO: connecter à Supabase ici
    alert('Connexion bientôt fonctionnelle — Supabase arrive !');
  }
 
  function handleSignup() {
    const username = document.getElementById('signup-username').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    const err = document.getElementById('signup-error');
    if (!username || !email || !password) {
      err.textContent = 'Remplis tous les champs.';
      return;
    }
    if (!email.includes('@')) {
      err.textContent = 'Adresse courriel invalide.';
      return;
    }
    if (password.length < 11) {
      err.textContent = 'Mot de passe trop court (min. 11 caractères).';
      return;
    }
    err.textContent = '';
    // TODO: connecter à Supabase ici
    alert('Inscription bientôt fonctionnelle — Supabase arrive !');
  }
</script>
 
</body>
</html>
