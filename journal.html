<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>No Excuse — Journal</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--bg:#252829;--bg2:#1e2021;--accent:#c0765a;--text:#f0ede8;--text2:rgba(240,237,232,0.5);--text3:rgba(240,237,232,0.25);--border:rgba(240,237,232,0.08);--green:#7ec89a;--sidebar:64px;}
    *{cursor:none!important;}
    html,body{height:100%;font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;}
    #crosshair{position:fixed;width:36px;height:36px;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);}
    #crosshair.clicked{transform:translate(-50%,-50%) scale(0.7);}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);background:var(--bg2);border-right:0.5px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:24px 0;gap:28px;z-index:50;}
    .sidebar-logo{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.16em;color:var(--accent);writing-mode:vertical-rl;text-transform:uppercase;}
    .sidebar-divider{width:20px;height:0.5px;background:var(--border);}
    .nav-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;opacity:0.3;text-decoration:none;transition:opacity .2s,background .2s;}
    .nav-icon:hover{opacity:0.7;background:rgba(240,237,232,0.05);}
    .nav-icon.active{opacity:1;background:rgba(192,118,90,0.12);}
    .nav-icon svg{width:16px;height:16px;stroke:var(--text);fill:none;stroke-width:1.5;stroke-linecap:round;}
    .sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:16px;}
    .avatar-sm{width:32px;height:32px;border-radius:50%;background:rgba(192,118,90,0.2);border:0.5px solid rgba(192,118,90,0.4);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--accent);}
    .main{margin-left:var(--sidebar);padding:40px 44px;min-height:100vh;}
    .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;opacity:0;transform:translateY(12px);animation:fadeUp 0.6s ease forwards 0.1s;}
    .page-title{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;}
    .page-title span{color:var(--text3);}
    .add-btn{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;padding:10px 22px;background:var(--accent);border:none;border-radius:50px;color:#f0ede8;cursor:pointer;transition:opacity .2s;}
    .add-btn:hover{opacity:0.85;}
    .tag-filters{display:flex;gap:8px;margin-bottom:28px;opacity:0;animation:fadeUp 0.6s ease forwards 0.2s;}
    .tag-btn{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;padding:7px 16px;border-radius:50px;border:0.5px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;transition:all .2s;}
    .tag-btn:hover{border-color:rgba(240,237,232,0.2);color:var(--text2);}
    .tag-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(192,118,90,0.1);}
    .journal-list{display:flex;flex-direction:column;gap:8px;}
    .journal-card{background:var(--bg2);border-radius:10px;border:0.5px solid var(--border);padding:24px;opacity:0;transform:translateY(14px);transition:border-color .2s;}
    .journal-card.visible{animation:fadeUp 0.5s ease forwards;}
    .journal-card:hover{border-color:rgba(240,237,232,0.14);}
    .jc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
    .jc-left{display:flex;align-items:center;gap:14px;}
    .jc-date-block{text-align:center;}
    .jc-day{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;color:var(--text2);line-height:1;}
    .jc-month{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);}
    .jc-divider{width:0.5px;height:36px;background:var(--border);}
    .jc-session{font-size:12px;color:var(--text3);}
    .jc-session strong{display:block;font-size:13px;color:var(--text2);font-weight:500;margin-bottom:2px;}
    .jc-tag{font-size:9px;letter-spacing:0.12em;text-transform:uppercase;padding:4px 10px;border-radius:3px;}
    .tag-dur{background:rgba(192,118,90,0.15);color:var(--accent);}
    .tag-ok{background:rgba(126,200,154,0.12);color:var(--green);}
    .tag-focus{background:rgba(133,179,235,0.12);color:#85b3eb;}
    .tag-neut{background:rgba(240,237,232,0.07);color:var(--text3);}
    .jc-text{font-size:14px;color:rgba(240,237,232,0.55);line-height:1.7;}
    .empty-state{text-align:center;padding:80px 20px;opacity:0;animation:fadeUp 0.6s ease forwards 0.3s;}
    .empty-title{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;text-transform:uppercase;color:var(--text3);margin-bottom:10px;}
    .empty-sub{font-size:13px;color:rgba(240,237,232,0.2);}
    .modal-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(10,11,11,0.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);align-items:center;justify-content:center;}
    .modal-overlay.open{display:flex;}
    .modal{background:var(--bg2);border-radius:16px;border:0.5px solid rgba(240,237,232,0.12);padding:36px;width:100%;max-width:460px;animation:modalIn 0.4s cubic-bezier(.16,1,.3,1);}
    @keyframes modalIn{from{opacity:0;transform:scale(0.96) translateY(10px);}to{opacity:1;transform:none;}}
    .modal-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:28px;}
    .form-field{margin-bottom:18px;}
    .form-field label{display:block;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;}
    .form-field input,.form-field select,.form-field textarea{width:100%;background:rgba(240,237,232,0.05);border:0.5px solid rgba(240,237,232,0.12);border-radius:6px;padding:12px 14px;font-family:'Barlow',sans-serif;font-size:14px;color:var(--text);outline:none;transition:border-color .2s;}
    .form-field input::placeholder,.form-field textarea::placeholder{color:var(--text3);}
    .form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--accent);}
    .form-field select option{background:var(--bg2);}
    .form-field textarea{resize:none;height:120px;line-height:1.7;}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .tag-selector{display:flex;gap:8px;flex-wrap:wrap;}
    .tag-opt{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:6px 14px;border-radius:4px;border:0.5px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;transition:all .2s;}
    .tag-opt:hover{border-color:rgba(240,237,232,0.2);}
    .tag-opt.selected-dur{background:rgba(192,118,90,0.2);border-color:var(--accent);color:var(--accent);}
    .tag-opt.selected-ok{background:rgba(126,200,154,0.15);border-color:var(--green);color:var(--green);}
    .tag-opt.selected-focus{background:rgba(133,179,235,0.15);border-color:#85b3eb;color:#85b3eb;}
    .tag-opt.selected-neut{background:rgba(240,237,232,0.08);border-color:rgba(240,237,232,0.2);color:var(--text2);}
    .modal-actions{display:flex;gap:10px;margin-top:24px;}
    .btn-save{flex:1;padding:13px;background:var(--accent);border:none;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#f0ede8;cursor:pointer;transition:opacity .2s;}
    .btn-save:hover{opacity:0.85;}
    .btn-cancel{padding:13px 20px;background:transparent;border:0.5px solid var(--border);border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--text3);cursor:pointer;transition:background .2s;}
    .btn-cancel:hover{background:rgba(240,237,232,0.05);}
    .msg{font-size:12px;margin-top:10px;min-height:16px;}
    .msg.success{color:var(--green);}
    .msg.error{color:#e07a5f;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
    @media(max-width:768px){.main{padding:24px 16px;}.jc-divider,.jc-session{display:none;}}
  </style>
</head>
<body>
  <div id="crosshair"><svg viewBox="0 0 36 36" fill="none"><circle cx="18" cy="18" r="14" stroke="#c0765a" stroke-width="0.8" opacity="0.7"/><circle cx="18" cy="18" r="2.5" fill="#c0765a" opacity="0.9"/><line x1="18" y1="2" x2="18" y2="12" stroke="#c0765a" stroke-width="0.8" opacity="0.7"/><line x1="18" y1="24" x2="18" y2="34" stroke="#c0765a" stroke-width="0.8" opacity="0.7"/><line x1="2" y1="18" x2="12" y2="18" stroke="#c0765a" stroke-width="0.8" opacity="0.7"/><line x1="24" y1="18" x2="34" y2="18" stroke="#c0765a" stroke-width="0.8" opacity="0.7"/></svg></div>
  <aside class="sidebar">
    <div class="sidebar-logo">NE</div><div class="sidebar-divider"></div>
    <a class="nav-icon" href="dashboard.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></a>
    <a class="nav-icon" href="session.html"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></a>
    <a class="nav-icon active" href="journal.html"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></a>
    <div class="sidebar-bottom">
      <a class="nav-icon" href="profil.html"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
      <div class="avatar-sm">C</div>
    </div>
  </aside>
  <main class="main">
    <div class="top-bar">
      <div class="page-title">Journal <span id="journal-count"></span></div>
      <button class="add-btn" onclick="openModal()">+ Nouvelle note</button>
    </div>
    <div class="tag-filters">
      <button class="tag-btn active" onclick="filterJournal('all',this)">Toutes</button>
      <button class="tag-btn" onclick="filterJournal('Dur',this)">Dur</button>
      <button class="tag-btn" onclick="filterJournal('Solide',this)">Solide</button>
      <button class="tag-btn" onclick="filterJournal('Focus',this)">Focus</button>
      <button class="tag-btn" onclick="filterJournal('Neutre',this)">Neutre</button>
    </div>
    <div class="journal-list" id="journal-list"></div>
  </main>
  <div class="modal-overlay" id="modal-overlay" onclick="handleOverlay(event)">
    <div class="modal">
      <div class="modal-title">Nouvelle note</div>
      <div class="form-row">
        <div class="form-field"><label>Date</label><input type="date" id="f-date"/></div>
        <div class="form-field"><label>Session liée (optionnel)</label><input type="text" id="f-session" placeholder="ex: Distance 18m"/></div>
      </div>
      <div class="form-field">
        <label>Tag</label>
        <div class="tag-selector">
          <button class="tag-opt" onclick="selectTag('Dur',this)">Dur</button>
          <button class="tag-opt" onclick="selectTag('Solide',this)">Solide</button>
          <button class="tag-opt" onclick="selectTag('Focus',this)">Focus</button>
          <button class="tag-opt" onclick="selectTag('Neutre',this)">Neutre</button>
        </div>
      </div>
      <div class="form-field"><label>Note</label><textarea id="f-text" placeholder="Ce que t'as ressenti, ce qu'il faut corriger, ce qui a marché..."></textarea></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Annuler</button>
        <button class="btn-save" onclick="saveEntry()">Sauvegarder</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>
  </div>
  <script>
    const ch=document.getElementById('crosshair');let mx=innerWidth/2,my=innerHeight/2,cx=mx,cy=my;
    document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
    (function loop(){cx+=(mx-cx)*.18;cy+=(my-cy)*.18;ch.style.left=cx+'px';ch.style.top=cy+'px';requestAnimationFrame(loop);})();
    document.addEventListener('mousedown',()=>ch.classList.add('clicked'));
    document.addEventListener('mouseup',()=>ch.classList.remove('clicked'));
    const DEFAULT=[{date:'2025-03-27',session:'Distance 18m',tag:'Dur',text:'Ancrage pas constant. Bras gauche bouge à la lâché. Faut recommencer à filmer les séances. Ça sert à rien de tirer 72 flèches mal.'},{date:'2025-03-22',session:'Compétition simulée',tag:'Solide',text:'Meilleure session depuis 2 mois. La routine de respiration change tout. Keep going, pas relâcher.'},{date:'2025-03-18',session:'Entraînement libre',tag:'Focus',text:'Travail sur le relâché. Concentration maximale sur la main arrière. Progrès notables sur la consistance.'},{date:'2025-03-14',session:'Distance 25m',tag:'Neutre',text:'Session correcte. Distance plus longue, résultats dans la moyenne. Pas de progression flagrante mais pas de régression non plus.'}];
    const getEntries=()=>JSON.parse(localStorage.getItem('ne-journal')||'null')||DEFAULT;
    const tagClass=t=>t==='Dur'?'tag-dur':t==='Solide'?'tag-ok':t==='Focus'?'tag-focus':'tag-neut';
    let currentFilter='all',selectedTag='';
    function renderJournal(filter){
      const entries=getEntries();
      const filtered=filter==='all'?entries:entries.filter(e=>e.tag===filter);
      document.getElementById('journal-count').textContent=`(${entries.length})`;
      const list=document.getElementById('journal-list');
      if(!filtered.length){list.innerHTML='<div class="empty-state"><div class="empty-title">Aucune note</div><div class="empty-sub">Commence à écrire après tes séances.</div></div>';return;}
      list.innerHTML=filtered.map((e,i)=>{
        const d=new Date(e.date);
        const day=d.getDate().toString().padStart(2,'0');
        const month=d.toLocaleDateString('fr-CA',{month:'short'});
        return`<div class="journal-card" style="animation-delay:${i*.07}s"><div class="jc-head"><div class="jc-left"><div class="jc-date-block"><div class="jc-day">${day}</div><div class="jc-month">${month}</div></div><div class="jc-divider"></div><div class="jc-session"><strong>${e.session||'—'}</strong>Session liée</div></div><span class="jc-tag ${tagClass(e.tag)}">${e.tag}</span></div><div class="jc-text">${e.text}</div></div>`;
      }).join('');
      document.querySelectorAll('.journal-card').forEach(card=>{
        new IntersectionObserver(entries=>{entries.forEach(en=>{if(en.isIntersecting)en.target.classList.add('visible');});},{threshold:0.1}).observe(card);
      });
    }
    function filterJournal(filter,btn){currentFilter=filter;document.querySelectorAll('.tag-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderJournal(filter);}
    renderJournal('all');
    function openModal(){document.getElementById('modal-overlay').classList.add('open');document.getElementById('f-date').value=new Date().toISOString().split('T')[0];document.getElementById('msg').textContent='';document.getElementById('msg').className='msg';selectedTag='';document.querySelectorAll('.tag-opt').forEach(b=>{b.className='tag-opt';});}
    function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}
    function handleOverlay(e){if(e.target===document.getElementById('modal-overlay'))closeModal();}
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
    function selectTag(tag,btn){
      selectedTag=tag;
      document.querySelectorAll('.tag-opt').forEach(b=>b.className='tag-opt');
      const cls=tag==='Dur'?'selected-dur':tag==='Solide'?'selected-ok':tag==='Focus'?'selected-focus':'selected-neut';
      btn.classList.add(cls);
    }
    function saveEntry(){
      const date=document.getElementById('f-date').value,session=document.getElementById('f-session').value,text=document.getElementById('f-text').value,msg=document.getElementById('msg');
      if(!date||!text){msg.textContent='Remplis la date et la note.';msg.className='msg error';return;}
      const entries=getEntries();entries.unshift({date,session,tag:selectedTag||'Neutre',text});
      localStorage.setItem('ne-journal',JSON.stringify(entries));
      msg.textContent='Note sauvegardée ✓';msg.className='msg success';
      setTimeout(()=>{closeModal();renderJournal(currentFilter);},1000);
    }
  </script>
</body>
</html>
